<script>
    (function () {
        function fallbackCopyText(text, container) {
            return new Promise(function (resolve, reject) {
                const parent = container || document.body;
                const prevFocus = document.activeElement;
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.setAttribute('readonly', '');
                textarea.style.position = 'fixed';
                textarea.style.top = '0';
                textarea.style.left = '0';
                textarea.style.width = '1px';
                textarea.style.height = '1px';
                textarea.style.padding = '0';
                textarea.style.border = '0';
                textarea.style.opacity = '0';
                textarea.style.fontSize = '16px';
                parent.appendChild(textarea);

                try {
                    textarea.focus({ preventScroll: true });
                } catch (_) {
                    textarea.focus();
                }
                textarea.select();
                textarea.setSelectionRange(0, textarea.value.length);

                try {
                    const ok = document.execCommand('copy');
                    parent.removeChild(textarea);
                    if (prevFocus && typeof prevFocus.focus === 'function') {
                        try {
                            prevFocus.focus({ preventScroll: true });
                        } catch (_) {}
                    }
                    if (ok) resolve(); else reject(new Error('execCommand copy failed'));
                } catch (err) {
                    if (textarea.parentNode === parent) {
                        parent.removeChild(textarea);
                    }
                    reject(err);
                }
            });
        }

        function copyText(text, container) {
            if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function' && window.isSecureContext) {
                return navigator.clipboard.writeText(text).catch(function () {
                    return fallbackCopyText(text, container);
                });
            }
            return fallbackCopyText(text, container);
        }

        function refreshBanners(container) {
            const btnIcon = container.querySelector('.gs-refresh-btn i');
            const banners = container.querySelectorAll('.gs-banner[data-banner-src]');
            if (!banners.length) return;

            if (btnIcon) btnIcon.classList.add('fa-spin');
            let pending = banners.length;

            banners.forEach(function (img) {
                const baseSrc = img.getAttribute('data-banner-src');
                if (!baseSrc) {
                    if (--pending === 0 && btnIcon) btnIcon.classList.remove('fa-spin');
                    return;
                }
                const sep = baseSrc.indexOf('?') === -1 ? '?' : '&';
                const freshUrl = baseSrc + sep + '_t=' + Date.now();
                const probe = new Image();
                probe.onload = function () {
                    img.src = freshUrl;
                    if (--pending === 0 && btnIcon) btnIcon.classList.remove('fa-spin');
                };
                probe.onerror = function () {
                    if (--pending === 0 && btnIcon) btnIcon.classList.remove('fa-spin');
                };
                probe.src = freshUrl;
            });
        }

        function initOffcanvas() {
            document.querySelectorAll('.bitcore-offcanvas .gs-connect-row').forEach(function (row) {
                let resetTimer = null;
                const codeFrame = row.querySelector('.gs-code-frame');
                const copyBtn = row.querySelector('.gs-copy-btn');

                function handleCopy() {
                    const text = row.getAttribute('data-copy-text');
                    if (!text) return;

                    copyText(text, row).then(function () {
                        const icon = copyBtn ? copyBtn.querySelector('i') : null;
                        const label = copyBtn ? copyBtn.querySelector('.gs-copy-label') : null;
                        row.classList.add('is-copied');
                        if (icon) icon.className = 'fas fa-check';
                        if (label) label.textContent = 'Zkopírováno!';

                        if (resetTimer) clearTimeout(resetTimer);
                        resetTimer = setTimeout(function () {
                            row.classList.remove('is-copied');
                            if (icon) icon.className = 'fas fa-copy';
                            if (label) label.textContent = 'Kopírovat';
                        }, 1500);
                    }).catch(function () {
                        const codeEl = row.querySelector('.gs-code-text');
                        if (codeEl && window.getSelection) {
                            const range = document.createRange();
                            range.selectNodeContents(codeEl);
                            const sel = window.getSelection();
                            sel.removeAllRanges();
                            sel.addRange(range);
                        }
                    });
                }

                if (copyBtn) copyBtn.addEventListener('click', handleCopy);
                if (codeFrame) {
                    codeFrame.addEventListener('click', handleCopy);
                    codeFrame.addEventListener('keydown', function (e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            handleCopy();
                        }
                    });
                }
            });

            document.querySelectorAll('.bitcore-offcanvas').forEach(function (offcanvasEl) {
                offcanvasEl.addEventListener('show.bs.offcanvas', function () {
                    refreshBanners(offcanvasEl);
                });

                const refreshBtn = offcanvasEl.querySelector('.gs-refresh-btn');
                if (refreshBtn) {
                    refreshBtn.addEventListener('click', function () {
                        refreshBanners(offcanvasEl);
                    });
                }
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initOffcanvas);
        } else {
            initOffcanvas();
        }
    })();
</script>
