baseURL = "http://bitcore.cz"
languageCode = "cz-cs"
theme = "glim-midnight"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
    title = "Bitcore server"
    phrases = ["I`m a server", "Even if my screen is off,", "I`m still on.", "DON`T UNPLUG ME!"]
    links = [
    {name = "TeamSpeak servers", url = "https://ts.bitcore.cz/"},    
    {name = "Game servers", offcanvas = "gameServersOffcanvas"},
    {name = "Lineage II server", url = "https://l2.bitcore.cz/", newTab = true},    
    {name = "Admin", url = "https://pokorak.cz/", newTab = true},    
    ] 
    backgroundVideo = "bg.mp4"
    footer = "<a href='https://pokorak.cz/' target='_blank'>Aleš</a>@Bitcore.cz:~$ sudo install-bitcore-server --enable-services <strike>--fast</strike> --soon™"

    gameServersTitle = "Game servers"
    gameServersSubtitle = "Základní přehled herních serverů běžících na Bitcore."

    [[params.gameServers]]
        name = "Call of Duty 2"
        address = "gg.bitcore.cz:28960"
        commandPrefix = "/connect"
        banner = "https://cache.gametracker.com/server_info/gg.bitcore.cz:28960/b_560_95_1.png"
        url = "https://www.gametracker.com/server_info/gg.bitcore.cz:28960/"

    [[params.gameServers]]
        name = "Unreal Tournament"
        address = "gg.bitcore.cz:7777"
        commandPrefix = "/open"
        banner = "https://cache.gametracker.com/server_info/gg.bitcore.cz:7777/b_560_95_1.png"
        url = "https://www.gametracker.com/server_info/gg.bitcore.cz:7777/"

    [[params.gameServers]]
        name = "UTAssault"
        address = "gg.bitcore.cz:7140"
        commandPrefix = "/open"
        banner = "https://cache.gametracker.com/server_info/gg.bitcore.cz:7140/b_560_95_1.png"
        url = "https://www.gametracker.com/server_info/gg.bitcore.cz:7140/"

    [[params.gameServers]]
        name = "Unreal Tournament 2004"
        address = "gg.bitcore.cz:8888"
        commandPrefix = "/open"
        banner = "https://cache.gametracker.com/server_info/gg.bitcore.cz:8888/b_560_95_1.png"
        url = "https://www.gametracker.com/server_info/gg.bitcore.cz:8888/"
