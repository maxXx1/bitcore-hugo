baseURL = "http://bitcore.cz"
languageCode = "cz-cs"
theme = "glim-midnight"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
    title = "Bitcore server"
    phrases = ["I`m a server", "Even if my screen is off,", "I`m still on.", "DON`T UNPLUG ME!"]
    links = [
    {name = "TeamSpeak servers", offcanvas = "teamSpeakOffcanvas"},
    {name = "Call of Duty 2", offcanvas = "cod2Offcanvas"},
    {name = "Unreal Tournament", offcanvas = "ut99Offcanvas"},
    {name = "UTAssault", offcanvas = "utAssaultOffcanvas"},
    {name = "Unreal Tournament 2004", offcanvas = "ut2004Offcanvas"},
    {name = "Lineage II server", url = "https://l2.bitcore.cz/", newTab = true, muted = true},
    ] 
    backgroundVideo = "bg.mp4"
    footer = "<a href='https://pokorak.cz/' target='_blank'>Aleš</a>@Bitcore.cz:~$ sudo install-bitcore-server --enable-services <strike>--fast</strike> --soon™"

    voiceServersTitle = "TeamSpeak servery"
    voiceServersSubtitle = "Hlavní TeamSpeak 3 hlasový server, testovací TS6 a Discord."

    [params.ts3]
        name = "TeamSpeak 3"
        badge = "server v3.13.9"
        address = "ts3.bitcore.cz"
        connectUrl = "ts3server://ts3.bitcore.cz"
        connectLabel = "Připojit"

    [[params.voiceLinks]]
        name = "TeamSpeak 6"
        badge = "Beta"
        icon = "fab fa-teamspeak"
        address = "ts6.bitcore.cz:9988"
        connectUrl = "teamspeak://ts6.bitcore.cz?port=9988"
        connectLabel = "Připojit"

    [[params.voiceLinks]]
        name = "Discord"
        badge = "Komunita"
        icon = "fab fa-discord"
        address = "https://discord.gg/vkQXVPZ"
        connectUrl = "https://discord.gg/vkQXVPZ"
        connectLabel = "Připojit"
        newTab = true

    [[params.voiceLinks]]
        name = "Mumble"
        icon = "fas fa-microphone-alt"
        address = "mumble.bitcore.cz:64738"
        offline = true

    [[params.voiceLinks]]
        name = "Ventrilo"
        icon = "fas fa-microphone-alt"
        address = "ventrilo.bitcore.cz:3784"
        offline = true

    gameServersSubtitle = "Připojení do hry a živé statistiky serveru na Bitcore."

